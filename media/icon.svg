<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- VS Code paints activity-bar icons as a mask, so "C++" is cut out of the triangle -->
  <defs>
    <mask id="cut">
      <rect width="24" height="24" fill="#fff"/>
      <text x="6.6" y="14.6" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="7" letter-spacing="-0.4" fill="#000">C++</text>
    </mask>
  </defs>
  <path d="M5 2.8 L21.5 12 L5 21.2 Z" fill="#c5c5c5" stroke="#c5c5c5" stroke-width="1.2" stroke-linejoin="round" mask="url(#cut)"/>
</svg>
